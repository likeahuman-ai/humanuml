[package]
name = "humanuml"
version = "0.1.0"
edition = "2021"
description = "Flow diagrams as plain text: parse, check, JSON, SVG. Reads the PlantUML activity subset."
license = "MIT"

[lib]
name = "humanuml"
path = "src/lib.rs"

[[bin]]
name = "humanuml"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
